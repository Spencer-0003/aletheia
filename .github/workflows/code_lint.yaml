name: Lint Code
on:
  pull_request:
    paths:
      - 'src/**/*.rs'

env:
  RUSTFLAGS: '-Dwarnings'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint code
        run: cargo clippy --all-targets --all-features
