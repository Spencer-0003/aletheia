name: Lint GameDB
on:
  pull_request:
    paths:
      - 'resources/gamedb.yaml'
      - 'gamedb.schema.json'

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y yamllint && pip install check-jsonschema==0.38.0

      - name: Lint GameDB
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              document-start: disable,
              line-length: disable,
              key-ordering: enable,
              comments: { min-spaces-from-content: 1 }
            }
          }' -f github -s resources/gamedb.yaml

      - name: Validate GameDB schema
        run: check-jsonschema --schemafile gamedb.schema.json resources/gamedb.yaml
