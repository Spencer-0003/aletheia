app-id: moe.spencer.Aletheia
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/aletheia/cargo
  build-args:
    - --share=network

finish-args:
  # Used to display UI
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc # https://discourse.flathub.org/t/what-does-finish-args-x11-without-ipc-mean-and-how-do-you-fix-it/3279
  # Used to download GameDB updates
  - --share=network
  # Used in the event of the user wanting to backup saves to external storage
  - --filesystem=/run/media
  # Used to detect and restore Lutris save files
  - --filesystem=xdg-config/lutris # For cases where Aletheia is installed in Flatpak but Lutris is not
  - --filesystem=xdg-data/lutris # For cases where Aletheia is installed in Flatpak but Lutris is not
  - --filesystem=~/.var/app/net.lutris.Lutris
  - --filesystem=~/Games
  # Used to detect and restore Steam save files
  - --filesystem=xdg-data/Steam # For cases where Aletheia is installed in Flatpak but Steam is not
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  # Used to detect and restore Heroic save files
  - --filesystem=xdg-config/heroic # For cases where Aletheia is installed in Flatpak but Heroic is not
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  # Used to detect and restore itch.io save files
  - --filesystem=xdg-config/itch # For cases where Aletheia is installed in Flatpak but itch.io is not
  - --filesystem=~/.var/app/io.itch.itch

command: aletheia

modules:
  - name: aletheia
    buildsystem: simple
    build-commands:
      - cargo build --release --features updater
      - install -Dm755 ${FLATPAK_BUILDER_BUILDDIR}/target/release/aletheia ${FLATPAK_DEST}/bin/aletheia
    sources:
      - type: dir
        path: ../../
    post-install:
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/resources/linux/moe.spencer.Aletheia.desktop ${FLATPAK_DEST}/share/applications/moe.spencer.Aletheia.desktop
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/resources/logo/moe.spencer.Aletheia.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/moe.spencer.Aletheia.png
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/resources/linux/moe.spencer.Aletheia.metainfo.xml ${FLATPAK_DEST}/share/metainfo/moe.spencer.Aletheia.metainfo.xml
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/resources/linux/moe.spencer.Aletheia.mime.xml ${FLATPAK_DEST}/share/mime/packages/moe.spencer.Aletheia.mime.xml
